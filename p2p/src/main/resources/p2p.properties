# P2P Configuration for Headwind MDM
# Enable or disable P2P functionality
p2p.enabled=false

# Peer discovery method: mdns (local network) or hybrid (mdns + dht)
p2p.discovery.method=mdns

# Maximum number of concurrent peer connections
p2p.max.peers=10

# P2P content cache size in megabytes
p2p.content.cache.size=1024

# Enable super node mode (for gateway devices)
p2p.super.node.enabled=false

# P2P server port
p2p.server.port=9090

# Enable P2P content distribution
p2p.content.distribution.enabled=true

# Enable P2P log aggregation
p2p.log.aggregation.enabled=false

# Peer connection timeout in milliseconds
p2p.connection.timeout=30000

# Peer heartbeat interval in milliseconds
p2p.heartbeat.interval=60000

# Cache cleanup interval in milliseconds
p2p.cache.cleanup.interval=3600000

# Enable TLS for P2P connections
p2p.tls.enabled=true
