# P2P Configuration for Headwind MDM
# Enable or disable P2P functionality
p2p.enabled=false

# Peer discovery method: mdns (local network), dht (global), or hybrid (both)
p2p.discovery.method=hybrid

# Maximum number of concurrent peer connections
p2p.max.peers=10

# P2P content cache size in megabytes
p2p.content.cache.size=1024

# Enable super node mode (for gateway devices)
p2p.super.node.enabled=false

# P2P server port
p2p.server.port=9090

# Enable P2P content distribution
p2p.content.distribution.enabled=true

# Enable P2P log aggregation
p2p.log.aggregation.enabled=false

# Peer connection timeout in milliseconds
p2p.connection.timeout=30000

# Peer heartbeat interval in milliseconds
p2p.heartbeat.interval=60000

# Cache cleanup interval in milliseconds
p2p.cache.cleanup.interval=3600000

# Enable TLS for P2P connections
p2p.tls.enabled=true

# Global Discovery & DHT Settings
p2p.dht.enabled=true
p2p.dht.bootstrap.servers=https://bootstrap.revonixo.com:8443
p2p.dht.node.id.length=128

# NAT Traversal Configuration
p2p.nat.traversal.enabled=true
p2p.stun.servers=stun:stun.revonixo.com:3478,stun:stun.l.google.com:19302
p2p.turn.servers=turn:turn.revonixo.com:3478
p2p.turn.username=revonixo
p2p.turn.credential=

# Public IP detection
p2p.public.ip.detection.enabled=true
p2p.public.ip.detection.service=https://api.revonixo.com/v1/ip

# Signaling Server
p2p.signaling.enabled=true
p2p.signaling.server=wss://signal.revonixo.com/ws
p2p.signaling.timeout=30000
